services:
  - type: web
    name: bloom
    runtime: python
    plan: free
    buildCommand: pip install -r requirement.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
